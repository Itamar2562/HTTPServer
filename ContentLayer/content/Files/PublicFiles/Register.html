<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="script.js" defer></script>

</head>
<body>

<div class="center-shell">
  <main class="card">
    <h1 class="heading">Create account</h1>
    <p class="subtext">Fill in your details to get started.</p>

    <form id ='RegisterForm'>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter your password" autocomplete="new-password" />
      </div>

      <button type="submit" id = "submit" class="btn-primary">Create account</button>
    </form>

    <p class="form-footer">
      Already have an account? <a class="text-link" href="Login.html">Sign in</a>
    </p>
  </main>
</div>

</body>
</html>
